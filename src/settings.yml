---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.4
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://api.willyweather.com.au/v2/{{ api_key }}/locations/{% if location_id == "other" %}{{ custom_location_id }}{% else %}{{ location_id }}{% endif %}/weather.json?forecasts=weather,temperature,precis,rainfall,rainfallprobability&days=7&observational=true
polling_headers: ''
polling_body: ''
id: 529468
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: api_key
  field_type: password
  name: WillyWeather API key
  description: From willyweather.com.au API admin. Needs Forecasts (Weather, Temperature, Precis, Rainfall, Rainfall Probability) + Observational.
- keyname: location_id
  field_type: select
  name: Location
  options:
  - Sydney: '4950'
  - Canberra (Airport): '19662'
  - Other (enter ID below): other
  default: '4950'
- keyname: custom_location_id
  field_type: string
  name: Custom location ID
  description: Only used when Location = Other. Find via /v2/{key}/search.json?query=YourSuburb → location.id
  default: '4950'
- keyname: mode
  field_type: select
  name: View
  options:
  - Hourly: hourly
  - Daily (7-day): daily
  default: hourly
- keyname: hours
  field_type: select
  name: Hourly window
  options:
  - 12 hours: '12'
  - 24 hours: '24'
  - 36 hours: '36'
  - 48 hours: '48'
  default: '24'
name: WillyWeather Curve
description: ''
refresh_interval: 60
